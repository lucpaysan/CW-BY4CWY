name: Build Desktop & Mobile

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        # ⚠️ 原用 dtolnay/rust-action，该仓库已下线导致 Windows 构建
        #    在 "Set up job" 阶段直接失败（2026-10-04 修复）。
        #    rust-toolchain 是其现役替代品，targets 输入同名同义。
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch DeepCW model
        run: bash scripts/fetch-deepcw-model.sh
        # 模型约 15MB，未纳入版本库（见 .gitignore），
        # 因此 CI 需从上游 e04/deepcw-engine 下载。
        # 模型许可：AGPL-3.0-only
        shell: bash

      - name: Build Tauri app (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CW Lab v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc

  build-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch DeepCW model
        run: bash scripts/fetch-deepcw-model.sh
        # 模型约 15MB，未纳入版本库（见 .gitignore）
        # 模型许可：AGPL-3.0-only

      - name: Build Tauri app (Android)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CW Lab v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false