name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Fetch DeepCW model
        run: bash scripts/fetch-deepcw-model.sh
        # 模型约 15MB，未纳入版本库（见 .gitignore），
        # 因此 CI 需从上游 e04/deepcw-engine 下载。
        # 模型许可：AGPL-3.0-only

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -f dist/model_deepcw.onnx || { echo "::error::模型缺失"; exit 1; }
          test -f dist/model_deepcw.json || { echo "::error::元数据缺失"; exit 1; }
          echo "dist 体积: $(du -sh dist | cut -f1)"
          ls -la dist/*.onnx dist/*.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
